<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farewell Amruta 🚀</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Courier New', monospace;
    min-height:100vh;
    overflow-x:hidden;

    background:
    linear-gradient(
    135deg,
    #ffd6e8,
    #fff0c9,
    #d6f0ff,
    #ffe0f7);

    text-align:center;
    padding:40px;
}

/* Floating Balloons */

.balloon{
    position:fixed;
    font-size:60px;
    animation: float 8s infinite ease-in-out;
    opacity:.9;
}

.b1{left:5%; top:10%;}
.b2{right:8%; top:15%;}
.b3{left:12%; bottom:10%;}
.b4{right:12%; bottom:15%;}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-30px);}
    100%{transform:translateY(0);}
}

/* Flowers */

.flower{
    position:fixed;
    font-size:70px;
}

.f1{top:20px;left:20px;}
.f2{top:20px;right:20px;}
.f3{bottom:20px;left:20px;}
.f4{bottom:20px;right:20px;}

/* Title */

h1{
    margin-top:20px;
    font-size:70px;
    text-align:center;

    background:linear-gradient(
    90deg,
    #ff1493,
    #8a2be2,
    #ff4500);

    -webkit-background-clip:text;
    color:transparent;

    text-shadow:
    0 0 20px rgba(255,255,255,.8);
}

/* Subtitle */

.subtitle{
    margin-top:15px;
    color:#d63384;
    font-size:24px;
    font-weight:bold;
}

/* Button */

button{
    margin-top:40px;
    padding:18px 40px;

    border:none;
    border-radius:50px;

    background:linear-gradient(
    90deg,
    #ff1493,
    #ff69b4);

    color:white;
    font-size:24px;
    cursor:pointer;

    box-shadow:
    0 10px 30px rgba(255,20,147,.4);

    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

/* Message Box */

#message{

    display:inline-block;

    width:auto;
    max-width:85%;

    margin:40px auto;

    text-align:center;

    white-space:pre-wrap;

    font-size:20px;
    line-height:1.8;

    padding:25px 30px;

    border-radius:25px;

    background:rgba(255,255,255,.85);

    backdrop-filter:blur(10px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.15);

    overflow-wrap:break-word;
}

.cursor{
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

</style>
</head>

<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div>
<div class="balloon b4">🎈</div>

<div class="flower f1">🌸</div>
<div class="flower f2">🌹</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌷</div>

<h1>Farewell, Amruta! 🚀</h1>

<div class="subtitle">
💖 A special message is waiting for you... 💖
</div>

<button onclick="startTyping()">
🔓 Unlock Farewell Message
</button>

<div id="message"></div>

<script>

const text = `

╔══════════════════════════════════════╗
 ║          Farewell, Amruta! 🚀      ║ 
╚══════════════════════════════════════╝

Thank you for being an amazing colleague and Mothii TAI ❤️

Your hard work, positivity, and dedication
have inspired everyone around you and made
a lasting impact on our team.

As you begin this exciting new chapter,
may success follow you wherever you go.

💜 May you achieve all your goals.
💙 May you create wonderful memories.
💚 May you embrace new opportunities.
🧡 May you reach even greater heights in your career.

Best of luck for your new journey!

You are leaving this company,
but the memories and friendships you created
will always remain with us.

❤️ We will miss you, Amruta!

----------------------------------------------
System Status:
Friendship      : ACTIVE
Memories        : STORED FOREVER
Success         : LOADING... ∞%
Happiness       : LOADING... ∞%
Future          : BRIGHT ✨
----------------------------------------------

❤️ From Your Team 3DI ❤️ (3 Dimensional Immersive)
`;

let started=false;

function startTyping(){

    if(started) return;
    started=true;

    const msg=document.getElementById("message");

    let i=0;

    function type(){

        if(i<text.length){

            msg.innerHTML=
            text.substring(0,i+1)+
            '<span class="cursor">|</span>';

            i++;

            setTimeout(type,25);

        }else{
            msg.innerHTML=text;
        }
    }

    type();
}

</script>

</body>
</html>
